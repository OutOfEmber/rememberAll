<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=768px, initial-scale=1.0">
    <link rel="stylesheet" href="css.css">
    <title>Кофейня</title>
</head>
    <body>
    <div class="hero">
        <h1 class="title">Кофейня</h1>
        <h2 class="subtitle">Кумыс вместо молока</h2>
        <button class="herobtn">Смотреть меню</button>
        <div class="about"></div>
    </div>

    <!-- menu -->
    <div class="modal-container hidden">
        <div class="modal">
            <h2>Меню</h2>
            <div class="menu_search">
                <input class="search" placeholder="Поиск">
                <button class="submit">Найти</button>
            </div>
                <div class="menu">
                <div class="menu_item">
                    <div class="menu_item_info">
                        <img class="menu_item_img" src="https://majestycoffee.com/cdn/shop/articles/americano_b74a8154-454b-4f74-9a6c-95fbc4152ed3.jpg?v=1684048195" alt="cofe">
                        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit.</p>
                    </div>
                    <p class="menu_item_price">900p</p>
                    <button class="menu_item_btn">В корзину</button>
                </div>
                <div class="menu_item">
                    <div class="menu_item_info">
                        <img class="menu_item_img" src="https://majestycoffee.com/cdn/shop/articles/americano_b74a8154-454b-4f74-9a6c-95fbc4152ed3.jpg?v=1684048195" alt="cofe">
                        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit.</p>
                    </div>
                    <p class="menu_item_price">900p</p>
                    <button class="menu_item_btn">В корзину</button>
                </div>
                
            </div>
            <button class="closeModal">X</button>
        </div>
    </div>
    </body>
    <script>
        const modal = document.querySelector('.modal-container')
        const herobtn = document.querySelector('.herobtn')
        const closeModal = document.querySelector('.closeModal')
        const title = document.querySelector('.title')
        herobtn.addEventListener('click', ()=>{
            modal.classList.remove('hidden')
        })
        closeModal.addEventListener('click', ()=>{
            modal.classList.add('hidden')
        })
    </script>
</html>
